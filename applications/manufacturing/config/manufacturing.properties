###############################################################################
# Manufacturing API Configuration
###############################################################################

# When true, Order module calls to Manufacturing services use the REST API
# instead of direct ServiceDispatcher calls. Set to false (default) to use
# the existing dispatcher path for backward compatibility.
manufacturing.api.use-rest=false

# Base URL for the Manufacturing REST API (used when use-rest=true).
# This should point to the manufacturing webapp's REST endpoint.
manufacturing.api.base-url=https://localhost:8443/manufacturing/api/v1/manufacturing
